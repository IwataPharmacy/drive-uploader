<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drive Uploader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7F9;
    --card: #FFFFFF;
    --ink: #17293D;
    --ink-soft: #5B6B7C;
    --accent: #0E7C7B;
    --accent-soft: #E3F1F0;
    --line: #DCE3E9;
    --error: #C0392B;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  h1 .dot { color: var(--accent); }
  .sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .value { font-size: 15px; font-weight: 500; word-break: break-all; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { opacity: 0.88; }
  button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  button:disabled { background: var(--line); color: var(--ink-soft); cursor: default; }
  button.ghost { background: var(--accent-soft); color: var(--accent); }

  /* ドロップゾーン */
  #dropzone {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    background: var(--card);
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }
  #dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  #dropzone .big { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  #dropzone.dragover .big { color: var(--accent); }

  /* ファイルリスト */
  #filelist { list-style: none; margin-top: 14px; }
  #filelist li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fname { font-weight: 500; word-break: break-all; }
  .fstatus { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .fstatus.done { color: var(--accent); }
  .fstatus.err { color: var(--error); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }

  .hidden { display: none !important; }
  #status { font-size: 12px; color: var(--ink-soft); margin-top: 8px; min-height: 1em; }
  #status.err { color: var(--error); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Drive Uploader<span class="dot">.</span></h1>
    <div class="sub">選んだフォルダへ、どの端末からでも直送</div>
  </header>

  <!-- STEP 1: ログイン -->
  <div class="card" id="authCard">
    <div class="row">
      <div>
        <div class="label">アカウント</div>
        <div class="value" id="authState">未ログイン</div>
      </div>
      <button id="btnAuth">Googleでログイン</button>
    </div>
  </div>

  <!-- STEP 2: フォルダ選択 -->
  <div class="card hidden" id="folderCard">
    <div class="row">
      <div>
        <div class="label">保存先フォルダ</div>
        <div class="value" id="folderName">未選択</div>
      </div>
      <button class="ghost" id="btnPick">フォルダを選択</button>
    </div>
  </div>

  <!-- STEP 3: アップロード -->
  <div id="uploadArea" class="hidden">
    <div id="dropzone" role="button" tabindex="0" aria-label="ファイルを選択">
      <div class="big">ここにファイルをドロップ</div>
      <div>またはタップして選択(複数可)</div>
    </div>
    <input type="file" id="fileInput" multiple class="hidden">
    <ul id="filelist"></ul>
  </div>

  <div id="status"></div>
</div>

<script>
/* ====== 設定(自分の値に書き換える) ====== */
const CLIENT_ID = "ここにOAuthクライアントIDを入力.apps.googleusercontent.com";
const API_KEY   = "ここにAPIキーを入力"; // Picker API用
const SCOPES    = "https://www.googleapis.com/auth/drive.file";
/* ========================================= */

let tokenClient = null;
let accessToken = null;
let tokenExpiresAt = 0;
let pickerReady = false;
let folder = JSON.parse(localStorage.getItem("driveUploaderFolder") || "null");

const $ = (id) => document.getElementById(id);

/* ---------- 初期化 ---------- */
window.addEventListener("load", () => {
  // GIS(認証)スクリプト読み込み待ち
  const waitGis = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(waitGis);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: onToken,
      });
    }
  }, 100);
  // Picker用 gapi 読み込み待ち
  const waitGapi = setInterval(() => {
    if (window.gapi) {
      clearInterval(waitGapi);
      gapi.load("picker", () => { pickerReady = true; });
    }
  }, 100);

  if (folder) $("folderName").textContent = folder.name;
});

/* ---------- 認証 ---------- */
$("btnAuth").addEventListener("click", () => {
  tokenClient.requestAccessToken({ prompt: "" });
});

function onToken(resp) {
  if (resp.error) { setStatus("ログインに失敗しました: " + resp.error, true); return; }
  accessToken = resp.access_token;
  tokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000; // 60秒早めに失効扱い
  $("authState").textContent = "ログイン済み";
  $("btnAuth").textContent = "再ログイン";
  $("folderCard").classList.remove("hidden");
  if (folder) $("uploadArea").classList.remove("hidden");
  setStatus("");
}

async function ensureToken() {
  if (accessToken && Date.now() < tokenExpiresAt) return accessToken;
  return new Promise((resolve, reject) => {
    const prev = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = prev;
      onToken(resp);
      resp.error ? reject(resp) : resolve(resp.access_token);
    };
    tokenClient.requestAccessToken({ prompt: "" });
  });
}

/* ---------- フォルダ選択(Picker) ---------- */
$("btnPick").addEventListener("click", async () => {
  if (!pickerReady) { setStatus("Picker読み込み中です。少し待ってからもう一度お試しください。", true); return; }
  await ensureToken();
  const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
    .setSelectFolderEnabled(true)
    .setMimeTypes("application/vnd.google-apps.folder");
  const picker = new google.picker.PickerBuilder()
    .setOAuthToken(accessToken)
    .setDeveloperKey(API_KEY)
    .addView(view)
    .setTitle("保存先フォルダを選択")
    .setCallback((data) => {
      if (data.action === google.picker.Action.PICKED) {
        const doc = data.docs[0];
        folder = { id: doc.id, name: doc.name };
        localStorage.setItem("driveUploaderFolder", JSON.stringify(folder));
        $("folderName").textContent = folder.name;
        $("uploadArea").classList.remove("hidden");
      }
    })
    .build();
  picker.setVisible(true);
});

/* ---------- ファイル選択・ドラッグ&ドロップ ---------- */
const dz = $("dropzone");
const fi = $("fileInput");

dz.addEventListener("click", () => fi.click());
dz.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fi.click(); });
fi.addEventListener("change", () => { handleFiles(fi.files); fi.value = ""; });

["dragenter", "dragover"].forEach(ev =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("dragover"); }));
["dragleave", "drop"].forEach(ev =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("dragover"); }));
dz.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));

function handleFiles(fileList) {
  if (!folder) { setStatus("先に保存先フォルダを選択してください。", true); return; }
  [...fileList].forEach(uploadFile);
}

/* ---------- アップロード(resumable) ---------- */
async function uploadFile(file) {
  const li = document.createElement("li");
  li.innerHTML = `<div class="fname">${escapeHtml(file.name)}</div>
                  <div class="fstatus">準備中...</div>
                  <div class="bar"><div></div></div>`;
  $("filelist").prepend(li);
  const statusEl = li.querySelector(".fstatus");
  const barEl = li.querySelector(".bar > div");

  try {
    const token = await ensureToken();

    // 1. resumableセッション開始
    const initRes = await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json; charset=UTF-8",
        "X-Upload-Content-Type": file.type || "application/octet-stream",
      },
      body: JSON.stringify({ name: file.name, parents: [folder.id] }),
    });
    if (!initRes.ok) throw new Error("セッション開始失敗 (" + initRes.status + ")");
    const uploadUrl = initRes.headers.get("Location");

    // 2. 本体をPUT(XHRで進捗取得)
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          barEl.style.width = pct + "%";
          statusEl.textContent = "アップロード中 " + pct + "%";
        }
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
        ? resolve() : reject(new Error("アップロード失敗 (" + xhr.status + ")"));
      xhr.onerror = () => reject(new Error("ネットワークエラー"));
      xhr.send(file);
    });

    barEl.style.width = "100%";
    statusEl.textContent = "完了 ✓ (" + formatSize(file.size) + ")";
    statusEl.className = "fstatus done";
  } catch (err) {
    statusEl.textContent = "エラー: " + err.message;
    statusEl.className = "fstatus err";
  }
}

/* ---------- ユーティリティ ---------- */
function setStatus(msg, isErr) {
  const s = $("status");
  s.textContent = msg;
  s.className = isErr ? "err" : "";
}
function formatSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>

<!-- Google Identity Services(認証) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Google API Loader(Picker用) -->
<script src="https://apis.google.com/js/api.js" async defer></script>
</body>
</html>
